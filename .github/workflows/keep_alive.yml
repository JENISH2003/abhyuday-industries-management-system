name: Render Automated Keep-Alive & Cron Trigger

on:
  schedule:
    # Runs every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Render Website Health Endpoint
        run: |
          curl -s https://abhyuday-management-system.onrender.com/health || echo "Ping attempted"
